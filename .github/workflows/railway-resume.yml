name: Railway - Retomar de manha (08:00 BRT)

on:
  schedule:
    # 08:00 BRT = 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Retomar servico no Railway (numReplicas=1)
        run: |
          echo "Retomando servico Railway..."
          curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceUpdate(serviceId: \\\"${{ secrets.RAILWAY_SERVICE_ID }}\\\", environmentId: \\\"${{ secrets.RAILWAY_ENVIRONMENT_ID }}\\\", input: { numReplicas: 1 }) }\"}" \
            | tee response.json
          echo "Retomado em $(date)"

      # P2.4: MercadoPago pode ter tentado notificar o webhook enquanto o
      # serviço estava pausado (0 réplicas) — a app já reconcilia isso no
      # próprio boot, mas aguardamos e chamamos de novo aqui para não
      # depender só do timing do cold start.
      - name: Aguardar o serviço voltar a responder
        run: |
          echo "Aguardando health check..."
          for i in $(seq 1 20); do
            if curl -sf "${{ vars.APP_URL || 'https://umamusica-production.up.railway.app' }}/api/health" > /dev/null; then
              echo "Serviço no ar."
              break
            fi
            sleep 15
          done

      - name: Reconciliar pagamentos Pix pendentes
        run: |
          curl -s -X POST "${{ vars.APP_URL || 'https://umamusica-production.up.railway.app' }}/api/admin/reconcile-pending-payments" \
            -H "x-admin-key: ${{ secrets.ADMIN_DASHBOARD_KEY }}" \
            | tee reconcile.json
          echo "Reconciliação concluída em $(date)"
