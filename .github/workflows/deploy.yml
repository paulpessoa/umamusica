name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  # Gate: instala dependências e valida a build antes de deixar qualquer
  # coisa chegar em produção. O job `deploy` só roda se este passar.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || {
            # Known npm bug (npm/cli#4828): npm ci sometimes fails to
            # install a platform-specific optionalDependency (e.g. the
            # rollup/lightningcss native binaries), even with a good
            # lockfile. Retrying with a clean install works around it
            # instead of leaving every deploy permanently blocked.
            echo "npm ci failed, retrying with a clean npm install..."
            rm -rf node_modules
            npm install
          }

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Build (vite + server bundle)
        run: npm run build

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          # RAILWAY_TOKEN deve ser um Project Token gerado em:
          # railway.app → project → Settings → Tokens → New Token
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          railway up --service umamusica --detach
          echo "## 🚀 Deployed to Railway!" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://umamusica-production.up.railway.app" >> $GITHUB_STEP_SUMMARY

  # Smoke test pós-deploy: roda contra produção, mas nunca bloqueia o
  # deploy em si (já aconteceu no job anterior). Falhas aqui só avisam.
  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci || {
            echo "npm ci failed, retrying with a clean npm install..."
            rm -rf node_modules
            npm install
          }

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "https://umamusica.vercel.app"
        run: npx playwright test tests/login.spec.ts
